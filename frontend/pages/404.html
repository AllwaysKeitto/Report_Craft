<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>404 — Страница не найдена</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #1a1a40 0%, #3e1b66 100%);
            color: white;
            padding: 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            margin: 0;
            opacity: 0.2;
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <p class="error-message">Похоже, данные, которые вы ищете, были перемещены или не существуют.</p>
        <a href="index.html" class="btn btn-primary" style="width: auto; padding: 1rem 2rem;">Вернуться на главную</a>
    </div>
</body>
</html>
