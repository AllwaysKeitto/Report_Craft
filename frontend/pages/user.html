<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Отчёты — ReportCraft</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script defer src="/js/api.js"></script>
    <script defer src="/js/auth.js"></script>
    <script defer src="/js/user.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar" style="
            width: 260px; 
            background: #1e293b; 
            color: #ffffff; 
            padding: 2rem 1.5rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            flex-shrink: 0;
        ">
            <div>
                <div class="brand-wrapper" style="margin-bottom: 2.5rem; padding-left: 0.5rem;">
                    <h2 style="font-size: 1.5rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">
                        ReportCraft
                    </h2>
                    <span style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">
                        Панель управления

                    </h2>
                </div>

                <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <div id="nav-user-block" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <a href="/pages/user.html" class="nav-item active" style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            color: #ffffff; 
                            text-decoration: none; 
                            font-weight: 600; 
                            padding: 0.75rem 1rem; 
                            background: rgba(255, 255, 255, 0.1); 
                            border-radius: 6px;
                        ">
                            <i class="fa-solid fa-chart-pie" style="width: 18px; color: #0b99ff;"></i> 
                            <span>Мои отчёты</span>
                        </a>
                    </div>

                    <div id="nav-admin-block" style="display: none; flex-direction: column; gap: 0.5rem;">
                        <a href="/pages/constructor.html" class="nav-item" style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            color: #cbd5e1; 
                            text-decoration: none; 
                            padding: 0.75rem 1rem; 
                            border-radius: 6px; 
                            transition: all 0.2s ease;
                        ">
                            <i class="fa-solid fa-compass-drafting" style="width: 18px; color: #10b981;"></i> 
                            <span>Открыть Конструктор</span>
                        </a>
                    </div>
                    
                    <a href="/pages/catalog.html" class="nav-item" style="
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        color: #cbd5e1; 
                        text-decoration: none; 
                        padding: 0.75rem 1rem; 
                        border-radius: 6px; 
                        transition: all 0.2s ease;
                    ">
                        <i class="fa-solid fa-store" style="width: 18px;"></i> 
                        <span>Каталог </span>
                    </a>

                    <a href="https://t.me/evecon_bot" target="_blank" class="nav-item" style="
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        color: #cbd5e1; 
                        text-decoration: none; 
                        padding: 0.75rem 1rem; 
                        border-radius: 6px; 
                        transition: all 0.2s ease;
                    ">
                        <i class="fa-brands fa-telegram" style="width: 18px; color: #229ED9;"></i> 
                        <span>Telegram Бот</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
                <button onclick="window.Auth.logout()" class="btn" style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    background-color: #ef4444; 
                    color: white; 
                    padding: 0.75rem;
                    font-size: 0.95rem;
                    border-radius: 6px;
                    width: 100%;
                    cursor: pointer;
                    border: none;
                ">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Выйти из аккаунта</span>
                </button>
            </div>
        </aside>

        <main class="main-content" style="flex: 1; padding: 2.5rem; overflow-y: auto; background-color: var(--bg-main);">
            <header style="margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="font-size: 2rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px;">
                        Ваша библиотека лицензий
                    </h1>
                    <p style="color: var(--text-secondary); margin-top: 0.25rem; font-size: 0.95rem;">
                        Здесь собраны интерактивные отчёты которые вы приобрели
                    </p>
                </div>
            </header>

            <div id="user-purchased-grid" class="catalog-grid" style="padding: 0;"></div>
        </main>
    </div>

    <div id="report-render-canvas" style="display: none; background: #ffffff; width: 800px; padding: 20px;"></div>
</body>
</html>
